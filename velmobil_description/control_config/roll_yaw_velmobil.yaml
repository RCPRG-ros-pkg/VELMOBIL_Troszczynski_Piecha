controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    roll_yaw_controller:
      type: roll_yaw_controller/RollYawController

roll_yaw_controller:
  ros__parameters:
    reference_topic_name: "/cmd_vel"
    wheel_joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    yaw_joints:
      - front_left_yaw_joint
      - front_right_yaw_joint
      - rear_left_yaw_joint
      - rear_right_yaw_joint

    wheel_x_offsets: [0.445, 0.445, -0.279, -0.279]
    wheel_y_offsets: [0.38, -0.38, 0.38, -0.38]
    wheel_radius: 0.1016

