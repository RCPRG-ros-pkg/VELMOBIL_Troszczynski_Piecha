agent_training_drl_node:
  ros__parameters:
    seed: 0
    total_timesteps: 250000
    max_steps_per_episode: 250
    stage_shift_episodes: [500, 2000] # episodes for stage upshift
    quick_reroll_episode_rate: 20 # goal_position + start_position reroll
    hard_reroll_episode_rate: 50 # whole stage reroll
    reward_function_class_name: "ObstacleProximityIPAPRecNReward" # velmobil_agent/utilities/reward_function.py
    algorithm_name: "PPO"                                         # velmobil_agent/utilities/model_configuration.py (pt.1)
    algorithm_configuration: "4"                                  # velmobil_agent/utilities/model_configuration.py (pt.2)


simulation_manager:
  ros__parameters:
    seed: 0
    arena_size: 12
    stage_names: ["s1", "s2", "s3"]
    stages:
      s1:
        map: "velmobil_gym_mini"
        static_obstacles_num: 0
        dynamic_obstacles_num: 0
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 6.0
        goal_tolerance: 0.6
      s2:
        map: "curved_corridors"
        static_obstacles_num: 0
        dynamic_obstacles_num: 0
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 7.0
        goal_tolerance: 0.6
      s3:
        map: "four_way_hallway"
        static_obstacles_num: 0
        dynamic_obstacles_num: 0
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 8.0
        goal_tolerance: 0.7
