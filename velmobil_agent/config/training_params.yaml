agent_training_drl_node:
  ros__parameters:
    seed: 0
    max_steps_per_episode: 250
    stage_shift_episodes: [5000000, 500000000] # episodes for stage upshift
    quick_reroll_episode_rate: 20 # goal_position + start_position reroll
    hard_reroll_episode_rate: 40 # whole stage reroll


simulation_manager:
  ros__parameters:
    seed: 0
    arena_size: 12
    stage_names: ["s1", "s2", "s3"]
    stages:
      s1:
        static_obstacles_num: 0
        dynamic_obstacles_num: 0
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 5.0
        goal_tolerance: 0.5
      s2:
        static_obstacles_num: 5
        dynamic_obstacles_num: 0
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 8.0
        goal_tolerance: 0.5
      s3:
        static_obstacles_num: 8
        dynamic_obstacles_num: 2
        min_obstacle_speed: 1.2
        max_obstacle_speed: 2.5
        goal_distance: 11.0
        goal_tolerance: 0.5
